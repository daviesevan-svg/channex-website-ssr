# Guards the contact-form spam defence, from outside the Worker that hosts it.
#
# On 2026-09-05 `main` was six weeks behind `ssr-migration` and still
# deployable: merging three doc PRs into it shipped a 27 July snapshot to
# production, silently removing the spam classifier, Turnstile and the daily
# quarantine digest. Spam reached the sales inbox within hours.
#
# The digest was built to be the alarm for exactly that, but it runs inside the
# Worker — so the deploy that dropped Turnstile dropped the alarm with it, and
# the failure was silent. These checks run in Actions instead, which is why
# they survive a bad deploy. A failed run emails the repo owner.
#
# Two layers, deliberately:
#   before merge  — defence-intact, on the PR's MERGE RESULT. A stale base is
#                   red on the PR, so the bad tree never reaches production.
#   after deploy  — turnstile-live, against channex.io itself. Catches anything
#                   that gets past review, or breaks outside the repo (a wiped
#                   secret, a bad rollback from the dashboard).
name: Production guard

on:
  pull_request:
  schedule:
    - cron: "20 7 * * *" # shortly after the Worker's own 07:00 UTC digest
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  defence-intact:
    name: Spam defence is present in the code
    runs-on: ubuntu-latest
    steps:
      # On a pull_request this checks out the merge commit, so what is verified
      # is the tree that merging would actually produce — which is what makes a
      # stale base visible here rather than in production.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Classifier, Turnstile and digest are wired up
        run: node scripts/check-spam-defence.mjs

  turnstile-live:
    name: Spam defence is live on channex.io
    # Pointless on a PR: this checks production, which the PR has not changed.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Exits non-zero when TURNSTILE_SITE_KEY is absent from the served HTML,
      # which is true both when the key is unset and when the deployed build
      # has no Turnstile code at all — the case that actually bit us.
      - name: Turnstile site key is being served
        run: node scripts/check-turnstile.mjs https://channex.io

  single-branch:
    name: No second deployable branch
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cloudflare Workers Builds builds every branch in this repo, not just
      # the production one — verified against the merged codex/* branches. The
      # repo was consolidated to a single branch on 2026-09-05; a long-lived
      # branch reappearing behind main is the rollback trap re-forming.
      - name: ssr-migration must not come back stale
        run: |
          set -euo pipefail
          if ! git show-ref --verify --quiet refs/remotes/origin/ssr-migration; then
            echo "ssr-migration is gone — nothing can lag main. OK."
            exit 0
          fi
          behind=$(git rev-list --count origin/ssr-migration..origin/main)
          ahead=$(git rev-list --count origin/main..origin/ssr-migration)
          echo "ssr-migration is $behind behind and $ahead ahead of main."
          if [ "$behind" -ne 0 ] || [ "$ahead" -ne 0 ]; then
            echo "::error::ssr-migration is back and has diverged from main."
            echo "::error::Deploying either branch now ships a different site."
            exit 1
          fi
